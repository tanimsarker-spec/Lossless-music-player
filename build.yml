name: LOSSLESS Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android + Android TV (APK, AAB)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folder and patch
        run: |
          [ -d android ] || flutter create . --project-name lossless --org app.lossless --platforms=android
          python3 tool/patch_platforms.py
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: lossless-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
      # NOTE: release builds here use Flutter's default debug signing.
      # Configure your own keystore in android/app/build.gradle before
      # publishing to Google Play.

  ios:
    name: iOS (unsigned IPA)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folder and patch
        run: |
          [ -d ios ] || flutter create . --project-name lossless --org app.lossless --platforms=ios
          python3 tool/patch_platforms.py
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr LOSSLESS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: lossless-ios-unsigned
          path: LOSSLESS-unsigned.ipa

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folder
        run: '[ -d windows ] || flutter create . --project-name lossless --org app.lossless --platforms=windows'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath LOSSLESS-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lossless-windows
          path: LOSSLESS-windows-x64.zip

  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev mpv libasound2-dev libpulse-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folder
        run: '[ -d linux ] || flutter create . --project-name lossless --org app.lossless --platforms=linux'
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf LOSSLESS-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: lossless-linux
          path: LOSSLESS-linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.ipa
            dist/*.zip
            dist/*.tar.gz
